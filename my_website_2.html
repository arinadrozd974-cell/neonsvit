<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Супер Неоновий Сайт</title>
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    header {
      text-align: center;
      padding: 40px 0;
      font-size: 40px;
      font-weight: bold;
      color: #00f0ff;
      text-shadow: 0 0 20px #00f0ff;
    }
    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }
    .block {
      background: rgba(0, 255, 200, 0.1);
      border: 2px solid #00ffc8;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 0 15px #00ffc8;
    }
    button {
      padding: 12px 25px;
      border: none;
      background: #ff00e1;
      color: white;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 15px #ff00e1;
    }
    button:hover {
      background: #ff4bf0;
    }
  </style>
</head>
<body>
  <header>НЕОНОВИЙ СВІТ 🌌</header>
  <div class="container">
    <div class="block">
      <h2>Ласкаво просимо!</h2>
      <p>Це новий сайт, зроблений спеціально для тебе у стилі неону. Він виглядає яскраво, круто і дуже сучасно.</p>
    </div>

    <div class="block">
      <h2>Можливості сайту</h2>
      <ul>
        <li>Неоновий дизайн</li>
        <li>Анімовані ефекти</li>
        <li>Можна додавати розділи</li>
        <li>Можна робити інтерактивні кнопки</li>
      </ul>
    </div>

    <div class="block" style="text-align:center;">
      <h2>Натисни кнопку</h2>
      <button onclick="alert('Сюрприз! 💙 Неоновий світ каже привіт!');">Клік!</button>
    </div>
  </div>
</body>
</html>
